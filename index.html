<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Moura | Backend Developer</title>
    <meta name="description"
        content="Portfólio de Lucas Moura, Desenvolvedor Backend. Java, C#, Spring Boot, .NET, Clean Architecture." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucas Moura — Backend Developer" />
    <meta property="og:description" content="Portfólio interativo. Java, .NET, Clean Architecture, Microservices." />
    <meta property="og:image"
        content="https://cdn.discordapp.com/attachments/820086474757636129/1159313914392236113/download20231003231524.png?ex=689df078&is=689c9ef8&hm=7d7c39b3e7ba0fc3b1593d863de9651445b8d54975a8f75c907ae442506fa3fe&" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050507;
            --bg-card: rgba(15, 15, 20, 0.9);
            --accent-cyan: #00f2ff;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --grid-line: rgba(255, 255, 255, 0.03);
            --node-border: rgba(255, 255, 255, 0.1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --glow-color: 0, 242, 255;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover-bg: rgba(0, 242, 255, 0.03);
            --card-hover-border: rgba(0, 242, 255, 0.15);
            --modal-bg: #0a0e17;
            --modal-overlay: rgba(0, 0, 0, 0.85);
            --modal-inset: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            --btn-bg: rgba(0, 242, 255, 0.06);
            --btn-border: rgba(0, 242, 255, 0.2);
            --btn-hover-bg: rgba(0, 242, 255, 0.12);
            --btn-hover-text: #fff;
            --bar-track: rgba(255, 255, 255, 0.05);
            --title-color: #fff;
            --badge-bg: rgba(255, 255, 255, 0.05);
            --pulse-rgb: 0, 242, 255;
            --gh-bg: 0a0e17;
            --gh-text: e2e8f0;
            --gh-title: 00f2ff;
        }

        [data-theme="light"] {
            --bg-deep: #f4f0fa;
            --bg-card: rgba(255, 255, 255, 0.85);
            --accent-cyan: #7c3aed;
            --accent-blue: #6d28d9;
            --accent-purple: #581c87;
            --accent-green: #0d9488;
            --text-main: #1e1b4b;
            --text-dim: #64748b;
            --grid-line: rgba(124, 58, 237, 0.04);
            --node-border: rgba(124, 58, 237, 0.12);
            --glow-color: 124, 58, 237;
            --card-bg: rgba(124, 58, 237, 0.03);
            --card-border: rgba(124, 58, 237, 0.08);
            --card-hover-bg: rgba(124, 58, 237, 0.05);
            --card-hover-border: rgba(124, 58, 237, 0.2);
            --modal-bg: #ffffff;
            --modal-overlay: rgba(30, 27, 75, 0.4);
            --modal-inset: inset 0 1px 0 rgba(255, 255, 255, 0.8);
            --btn-bg: rgba(124, 58, 237, 0.06);
            --btn-border: rgba(124, 58, 237, 0.18);
            --btn-hover-bg: rgba(124, 58, 237, 0.1);
            --btn-hover-text: #1e1b4b;
            --bar-track: rgba(124, 58, 237, 0.08);
            --title-color: #1e1b4b;
            --badge-bg: rgba(124, 58, 237, 0.06);
            --pulse-rgb: 124, 58, 237;
            --gh-bg: ffffff;
            --gh-text: 1e1b4b;
            --gh-title: 7c3aed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .matrix-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            z-index: 0;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 800px;
            perspective: 2000px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .isometric-view {
            position: relative;
            width: 800px;
            height: 500px;
            transform-style: preserve-3d;
            transform: rotateX(55deg) rotateZ(-35deg) translateY(-50px);
            transition: var(--transition);
        }

        .pipeline-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .pipeline-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .flow-path {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 2;
            stroke-dasharray: 10 15;
            opacity: 0.3;
        }

        .data-packet {
            fill: var(--accent-cyan);
            filter: drop-shadow(0 0 6px rgba(var(--glow-color), 0.4));
        }

        .node {
            position: absolute;
            width: 200px;
            height: 130px;
            background: var(--bg-card);
            border: 1px solid var(--node-border);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 16px;
            transition: var(--transition);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .node:hover {
            border-color: var(--accent-cyan);
            transform: translateZ(20px);
            box-shadow: 0 20px 40px rgba(var(--glow-color), 0.12);
        }

        .node::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, transparent, rgba(var(--glow-color), 0.04));
            pointer-events: none;
        }

        .node-header {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .node-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .node-status {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        #node-user {
            top: 10%;
            left: 0%;
        }

        #node-client {
            top: 35%;
            left: 35%;
        }

        #node-auth {
            top: 0%;
            left: 70%;
        }

        #node-resource {
            top: 70%;
            left: 70%;
        }

        #node-xp {
            top: 70%;
            left: 5%;
        }

        .ui-overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 370px;
            pointer-events: none;
            z-index: 10;
        }

        .brand-label {
            font-family: 'Roboto Mono', monospace;
            color: var(--accent-cyan);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .brand-title {
            font-size: 36px;
            font-weight: 300;
            margin-bottom: 12px;
            letter-spacing: -1px;
            color: var(--title-color);
        }

        .overlay-desc {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .tech-stack {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .badge {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            padding: 4px 10px;
            background: rgba(124, 58, 237, 0.06);
            border: 1px solid var(--node-border);
            border-radius: 4px;
            color: var(--text-dim);
        }

        .lang-toggle {
            pointer-events: all;
            margin-top: 18px;
            display: inline-flex;
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 6px;
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
        }

        .lang-toggle button {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: inherit;
        }

        .lang-toggle button.active {
            background: rgba(124, 58, 237, 0.1);
            color: var(--accent-cyan);
        }

        .lang-toggle button:hover:not(.active) {
            background: rgba(var(--glow-color), 0.04);
        }

        .active-log {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--node-border);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: hidden;
            z-index: 10;
        }

        .log-entry {
            margin-bottom: 6px;
            color: var(--text-dim);
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        .log-time {
            color: var(--accent-purple);
        }

        .log-msg {
            color: var(--text-main);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .terminal-window {
            width: 90%;
            max-width: 720px;
            max-height: 85vh;
            background: var(--modal-bg);
            border: 1px solid rgba(var(--glow-color), 0.2);
            border-radius: 10px;
            box-shadow:
                0 8px 40px rgba(var(--glow-color), 0.08),
                0 0 80px rgba(var(--glow-color), 0.05),
                var(--modal-inset);
            display: flex;
            flex-direction: column;
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            position: relative;
        }

        .terminal-window::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(var(--glow-color), 0.008) 2px,
                    rgba(var(--glow-color), 0.008) 4px);
            pointer-events: none;
            z-index: 1;
            border-radius: 10px;
        }

        .terminal-window::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.5;
        }

        .modal-overlay.active .terminal-window {
            transform: scale(1) translateY(0);
        }

        .terminal-header {
            background: linear-gradient(180deg, rgba(var(--glow-color), 0.06), rgba(var(--glow-color), 0.02));
            border-bottom: 1px solid rgba(var(--glow-color), 0.1);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .terminal-title {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .terminal-controls {
            display: flex;
            gap: 8px;
        }

        .control-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-dot.red {
            background: #ff5f57;
            box-shadow: 0 0 6px rgba(255, 95, 87, 0.3);
        }

        .control-dot.yellow {
            background: #ffbd2e;
            box-shadow: 0 0 6px rgba(255, 189, 46, 0.3);
        }

        .control-dot.green {
            background: #28c840;
            box-shadow: 0 0 6px rgba(40, 200, 64, 0.3);
        }

        .control-dot:hover {
            filter: brightness(1.3);
            transform: scale(1.15);
        }

        .terminal-content {
            padding: 28px;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            position: relative;
            z-index: 2;
        }

        .terminal-content::-webkit-scrollbar {
            width: 4px;
        }

        .terminal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .terminal-content::-webkit-scrollbar-thumb {
            background: rgba(var(--glow-color), 0.15);
            border-radius: 4px;
        }

        .terminal-content h2 {
            font-family: 'Roboto Mono', monospace;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terminal-content h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(var(--glow-color), 0.25), transparent);
        }

        .terminal-content h3 {
            font-family: 'Roboto Mono', monospace;
            color: var(--accent-purple);
            font-size: 0.85rem;
            margin: 24px 0 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-content p {
            margin-bottom: 14px;
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .terminal-content strong {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .terminal-content a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .terminal-content a:hover {
            color: var(--accent-cyan);
        }

        .term-line {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(124, 58, 237, 0.03);
            border-left: 2px solid var(--accent-blue);
            border-radius: 0 6px 6px 0;
        }

        .term-line .prompt {
            color: var(--accent-green);
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            flex-shrink: 0;
            user-select: none;
        }

        .term-line .text {
            color: var(--text-dim);
            font-size: 0.92rem;
        }

        .term-line .text strong {
            color: var(--text-main);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: var(--btn-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(var(--glow-color), 0.08));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn-action:hover {
            background: var(--btn-hover-bg);
            border-color: var(--accent-cyan);
            color: var(--btn-hover-text);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(var(--glow-color), 0.12);
        }

        .btn-action:hover::before {
            opacity: 1;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .project-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .project-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 8px 0 0 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .project-item:hover {
            background: var(--card-hover-bg);
            border-color: var(--card-hover-border);
            transform: translateX(4px);
        }

        .project-item:hover::before {
            opacity: 1;
        }

        .project-item .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .project-item h3 {
            color: var(--title-color);
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }

        .project-item p {
            margin: 0 0 14px;
            color: var(--text-dim);
            font-size: 0.88rem;
        }

        .project-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .project-tag {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            padding: 3px 8px;
            background: rgba(var(--glow-color), 0.08);
            border: 1px solid rgba(var(--glow-color), 0.15);
            border-radius: 4px;
            color: var(--accent-cyan);
        }

        .skill-bars {
            display: grid;
            gap: 12px;
            margin: 16px 0;
        }

        .skill-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skill-bar .label {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            width: 100px;
            text-align: right;
            flex-shrink: 0;
        }

        .skill-bar .bar {
            flex: 1;
            height: 6px;
            background: var(--bar-track);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .skill-bar .fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .skill-bar .fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -1px;
            bottom: -1px;
            width: 8px;
            background: var(--accent-cyan);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .contact-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-card:hover {
            background: rgba(var(--glow-color), 0.06);
            border-color: rgba(var(--glow-color), 0.2);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(var(--glow-color), 0.08);
        }

        .contact-card .icon {
            font-size: 1.6rem;
        }

        .contact-card .card-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-card .card-value {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .xp-entry {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 14px;
            transition: all 0.3s;
        }

        .xp-entry:hover {
            border-color: rgba(var(--glow-color), 0.2);
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .xp-role {
            color: var(--title-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .xp-date {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            color: var(--accent-blue);
            white-space: nowrap;
        }

        .xp-company {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
        }

        .xp-entry ul {
            list-style: none;
            padding: 0;
        }

        .xp-entry ul li {
            color: var(--text-dim);
            font-size: 0.88rem;
            padding-left: 16px;
            position: relative;
            margin-bottom: 6px;
        }

        .xp-entry ul li::before {
            content: '›';
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: 700;
        }

        @keyframes flow {
            from {
                offset-distance: 0%;
            }

            to {
                offset-distance: 100%;
            }
        }

        .packet-anim {
            offset-path: path(var(--path));
            animation: flow 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(var(--pulse-rgb), 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(var(--pulse-rgb), 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(var(--pulse-rgb), 0);
            }
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);

                    </div>
                    <div class="xp-entry">
                        <div class="xp-header"><span class="xp-role">Software Development Intern</span><span class="xp-date">MAY 2025 – SEP 2025</span></div>
                        <div class="xp-company">@ Zitec — São Paulo, SP</div>
                        <ul>
                            <li>Built backend services with .NET and maintained legacy interfaces in ASPX/ASHX using Bootstrap.</li>
                            <li>Collaborative version control (Git) and code review to ensure quality and standardization.</li>
                        </ul>
                    </div>
                    <div class="xp-entry">
                        <div class="xp-header"><span class="xp-role">Product Intern (PO/PM)</span><span class="xp-date">NOV 2024 – APR 2025</span></div>
                        <div class="xp-company">@ Zitec — São Paulo, SP</div>
                        <ul>
                            <li>Active participation in Scrum ceremonies (Dailies, Reviews, Plannings), assisting with backlog prioritization.</li>
                            <li>Technical documentation of User Stories and acceptance criteria for the development team.</li>
                        </ul>
                    </div>
                `
            }
        };

        let currentLang = 'pt';

        function applyLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';

            document.getElementById('overlay-desc').innerHTML = i18n[lang].overlay_desc;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) {
                    el.innerHTML = i18n[lang][key];
                }
            });

            document.querySelectorAll('#lang-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        document.getElementById('lang-toggle').addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                applyLang(e.target.dataset.lang);
            }
        });

        applyLang('pt');

        const logs = [
            "Initializing handshake...",
            "Loading modules: [Java, Spring, .NET]...",
            "Connecting to GitHub API...",
            "Fetching repository metadata...",
            "Validating PKCE Verifier...",
            "Rendering isometric projection...",
            "System ready. Awaiting user input.",
            "Listening on port 8080...",
            "Clean Architecture layers resolved.",
            "Garbage collection started... done."
        ];

        const consoleEl = document.getElementById('log-console');
        let logIndex = 0;

        function addLog() {
            if (!consoleEl) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });

            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-msg">${logs[logIndex]}</span>
            `;

            consoleEl.prepend(entry);
            if (consoleEl.children.length > 7) {
                consoleEl.removeChild(consoleEl.lastChild);
            }

            logIndex = (logIndex + 1) % logs.length;
            setTimeout(addLog, 2000 + Math.random() * 3000);
        }

        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 60;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 60;
                const view = document.querySelector('.isometric-view');
                if (view) {
                    view.style.transform = `rotateX(${55 + yAxis}deg) rotateZ(${-35 + xAxis}deg) translateY(-50px)`;
                }
            });
        }

        const modalOverlay = document.getElementById('modal-base');
        const modalBody = document.getElementById('modal-body');
        const modalTitle = document.getElementById('modal-title');

        function openModal(type) {
            const key = `modal_${type}`;
            const html = i18n[currentLang][key];
            if (html) {
                modalBody.innerHTML = html;
                modalTitle.textContent = type.toUpperCase() + ".EXE";
                modalOverlay.classList.add('active');
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('.theme-icon');
        const themeLabel = themeToggle.querySelector('.theme-label');

        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = '🌙';
                themeLabel.textContent = 'DARK';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.textContent = '☀️';
                themeLabel.textContent = 'LIGHT';
            }

            const style = getComputedStyle(document.documentElement);
            const ghBg = style.getPropertyValue('--gh-bg').trim();
            const ghText = style.getPropertyValue('--gh-text').trim();
            const ghTitle = style.getPropertyValue('--gh-title').trim();

            document.querySelectorAll('img[alt="GitHub Stats"]').forEach(img => {
                const url = new URL(img.src);
                url.searchParams.set('bg_color', ghBg);
                url.searchParams.set('text_color', ghText);
                url.searchParams.set('title_color', ghTitle);
                img.src = url.toString();
            });
        }

        themeToggle.addEventListener('click', () => {
            const isLight = document.documentElement.hasAttribute('data-theme');
            applyTheme(isLight ? 'dark' : 'light');
        });

        addLog();
    </script>
</body>

</html>
